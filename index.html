<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e4a50">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; background: #0e4a50; color: #fff; text-align: center; }
  .casa { font-size: 76px; line-height: 1; }
  h1 { font-size: 22px; font-weight: 600; margin: 14px 0 6px; }
  p { margin: 6px 0; opacity: .9; font-size: 15px; }
  .btn { display: inline-block; margin-top: 18px; padding: 14px 26px; border-radius: 12px; background: #fff; color: #0e4a50;
    font-weight: 700; font-size: 16px; text-decoration: none; }
  .ayuda { margin-top: 26px; font-size: 13px; opacity: .8; max-width: 320px; }
</style>
</head>
<body>
  <main>
    <div class="casa">🏠</div>
    <h1>Mis Finanzas</h1>
    <p id="msg">Abriendo tu app&hellip;</p>
    <a class="btn" id="ir" href="#">Abrir Mis Finanzas</a>
    <div class="ayuda" id="ayuda" hidden>
      Para tenerla en tu pantalla: men&uacute; de Chrome (&#8942;) &rarr; <b>Agregar a pantalla principal</b>.
      Quedar&aacute; con esta casita.
    </div>
  </main>
  <script>
    var destino = "https://script.google.com/macros/s/AKfycbzlt2R9cYzuTfRR_mJS69caDjLQFBrtnROwXKBP8NrE8CTxE1V7eu0_Xjhobs4VvXCc/exec";
    document.getElementById("ir").href = destino;
    var instalada = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    if (instalada) {
      location.replace(destino);        // abierta desde la casita del inicio: va directo a la app
    } else {
      document.getElementById("msg").textContent = "Toca el botón para abrir, o agrégala a tu pantalla.";
      document.getElementById("ayuda").hidden = false;   // primera visita en el navegador: muestra cómo agregarla
    }
  </script>
</body>
</html>
